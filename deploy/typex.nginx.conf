server {
    listen 80;
    server_name typex.mushayu.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://typex.mushayu.com$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name typex.mushayu.com;
    root /opt/typex/current;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/typex.mushayu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/typex.mushayu.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location = /index.html { expires -1; try_files $uri =404; }
    location /assets/ { expires 1y; try_files $uri =404; }
    location /licenses/ { try_files $uri =404; }
    location = /favicon.svg { expires -1; try_files $uri =404; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.html; }
}
